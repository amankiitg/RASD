name: rasd-gpu
channels:
  - pytorch
  - nvidia
  - huggingface
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core ML — CUDA 12.1
  - pytorch::pytorch=2.1.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # Data & modelling
  - numpy
  - pandas
  - scipy

  # Visualisation
  - matplotlib
  - seaborn

  # Utilities
  - tqdm
  - pyyaml
  - jsonlines

  - pip:
    - transformers>=4.46,<4.48    # MLSys: pin verified against upstream
                                   # LlamaAttention source, not guessed.
                                   #   >=4.46 : registers Llama-3.2
                                   #   <4.48  : 4.48.0 REMOVED
                                   #            self.num_key_value_heads and
                                   #            moved rotary_emb, breaking the
                                   #            ring patch (checked v4.46.3/
                                   #            4.47.0/4.47.1 OK vs v4.48.0/
                                   #            4.49.0/4.52.4/4.57.6 BROKEN).
                                   # An earlier >=4.46,<5 bound installed
                                   # 4.57.6 and cost a run: the ring patch
                                   # breaks for Llama-2 targets too, not
                                   # just the native arms.
                                   # Was ==4.44.2 (dynamic RoPE, tuple past_kv).
    - datasets>=2.16.0
    - tokenizers>=0.15.0
    - accelerate==0.33.0         # >=1.0 breaks bitsandbytes .to() on quantized models
    - bitsandbytes>=0.49.0       # <0.45 missing CUDA 12.9 .so; 0.44 triton import error
    - diptest>=0.9.0             # MLSys Phase 4 dip test. >=0.9.0 is the last
                                 # release with a cp310 manylinux wheel (pod
                                 # python is 3.10); don't pin 0.11.0 here.
    - wandb>=0.16.0
    # flash-attn is intentionally NOT here — its setup.py imports torch,
    # which conda's pip subcall doesn't see (no --no-build-isolation).
    # The pod bootstrap installs it explicitly via:
    #   pip install --no-build-isolation flash-attn>=2.4.0
    # See scripts/auto_execute_phase_c.sh.
    - deepspeed>=0.12.0
    - ninja
    - packaging