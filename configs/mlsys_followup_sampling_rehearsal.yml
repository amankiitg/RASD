ROPE_SAMP_NATIVE_SPEC:
  name: rope_samp_native
  factor: context_length
  levels:
  - id: ROPE_SAMP_NATIVE_SPEC
    # The rope intervention needs a target that SHIPS a rope_scaling to
    # modify. gradientai/...-Gradient-1048k ships rope_scaling: None, and the
    # engine refuses llama3 rope on it outright:
    #   ValueError: rope_type='llama3' requested for ... but its shipped
    #   rope_scaling is None; this rung requires a model that ...
    # Caught by the 2026-10-11 rehearsal (ROPE_SAMP_F16_SPEC, 2 error rows).
    target_model_name: meta-llama/Llama-3.1-8B
    target_revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
    context_length: 4096
    documents:
    - pg19_train_0
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 8
    rope_type: none
    notes: 'STEP g: native control, shipped llama3 block untouched'
