# REHEARSAL for the quantization ablation: SAME STAGE IDS, SAME ONE-SETTING CHANGES, TINY
# SIZES (8192 context, 48 tokens, one book).
#
# 48 TOKENS AND NOT 4: the seeds/ablations rehearsal's first attempt at 4 made every
# acceptance 0.0/4 and the session's OWN GATE stopped it at stage 3 -- a rehearsal that
# cannot exercise the stages after the gate is not a rehearsal of them.
#
# WHAT THIS PROVES AND CANNOT. It proves the per-level keys `quantize_target: false` and
# `kv_quant: false` survive the config -> pod path and that the four stages run in priority
# order with an in-session control. It cannot prove anything about the ring: one rank means
# `install_ring_attention` is a no-op, and at 8192 context the per-step costs this session
# exists to measure are 16x smaller than at 128k.
defaults:
  target_model_name: gradientai/Llama-3-8B-Instruct-Gradient-1048k
  target_revision: cd3069b65a8eb13da639d332a5f61b0fbb29fa73
  draft_model_name: meta-llama/Llama-3.2-1B
  draft_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  spec_steps: 4
  kv_block_size: 2048
  prefetch_depth: 1
  rope_type: "none"
  kv_quant: true
  dtype: bfloat16
  quantize_draft: true
  quantize_target: true
  draft_window_cap: 4096
  ignore_eos: true
  top_p: 1.0
  seeds: [42]
  log_per_token: true
  save_generated_tokens: true
  temperature: 0.7
  max_new_tokens: 48
  measure_target_ppl: false
  prompt_gen_tokens: 1024
  prompt_source: pg19_document

SAQ_CONTROL:
  name: saq_control
  factor: context_length
  levels:
  - id: SAQ_CONTROL_TARGET
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    spec_steps: 0
    notes: 'CONTROL: headline settings (FP4 weights, NF4 KV round-trip), target-only, in-session denominator'
  - id: SAQ_CONTROL_SPEC
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    notes: 'CONTROL: headline settings, spec arm'

SAQ_BOTH_OFF:
  name: saq_both_off
  factor: context_length
  levels:
  - id: SAQ_BOTH_OFF_TARGET
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    spec_steps: 0
    quantize_target: false
    kv_quant: false
    notes: 'CHANGES TWO SETTINGS on purpose: bf16 weights AND bf16 KV, the decisive contrast'
  - id: SAQ_BOTH_OFF_SPEC
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    quantize_target: false
    kv_quant: false
    notes: 'bf16 weights and bf16 KV, spec arm'

SAQ_W_OFF:
  name: saq_w_off
  factor: context_length
  levels:
  - id: SAQ_W_OFF_TARGET
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    spec_steps: 0
    quantize_target: false
    notes: 'ONESETTING: bf16 weights (quantize_target false), NF4 KV unchanged, target-only'
  - id: SAQ_W_OFF_SPEC
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    quantize_target: false
    notes: 'ONESETTING: bf16 weights, spec arm'

SAQ_KV_OFF:
  name: saq_kv_off
  factor: context_length
  levels:
  - id: SAQ_KV_OFF_TARGET
    context_length: 8192
    documents: [pg19_train_0]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.7
    max_new_tokens: 48
    spec_steps: 0
    kv_quant: false
    notes: 'ONESETTING: KV round-trip off (kv_quant false), FP4 weights unchanged, target-only'
  - id: SAQ_KV_OFF_SPEC
    context_length: 8192
    documents: [pg19_train_0]
