# MLSys — SYNTHETIC-prompt speculative runs across the rungs.
#
# TARGET POLICY: Llama-3.1-8B. At 128k it runs its NATIVE shipped `llama3` rope
# block, untouched. Above 128k ONLY a rope configuration that PASSED
# results/mlsys/coherence_gate.csv may be used.
#
# This is the SECONDARY arm. The synthetic prompt is the repeated-paragraph
# builder, which historically produced LOWER acceptance than natural text, and
# its own saturation (92.6-96.3% fully-accepted rounds) is part of what the
# natural arm exists to test. Running both at the SAME configurations makes the
# paired difference a measure of prompt content rather than of the system.
#
# DECODING CONTRACT (docs/mlsys_analysis_plan.md section 2): greedy, 1024
# generated tokens, ignore_eos true. The document builder derives the prompt so
# the sequence the engine builds is EXACTLY `context_length`.
#
# UNITS OF INDEPENDENCE: the DOCUMENT. The synthetic prompt does not depend on
# the book's text, but the run is still paired to the natural arm by document so
# the two arms are compared on the same 10 units.
defaults:
  target_model_name: meta-llama/Llama-3.1-8B
  draft_model_name: meta-llama/Llama-3.2-1B
  target_revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  draft_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  spec_steps: 4
  kv_block_size: 2048
  prefetch_depth: 1
  kv_quant: true
  dtype: bfloat16
  quantize_draft: true
  quantize_target: true
  draft_window_cap: 4096
  max_new_tokens: 1024
  ignore_eos: true
  temperature: 0.0        # GREEDY, per plan section 2. Sampling would make
                          # the seed-dependent-prompt claim false and the
                          # token-identity losslessness check invalid.
  top_p: 1.0
  seeds: [42]
  log_per_token: true
  save_generated_text: true
  save_generated_tokens: true
  measure_target_ppl: true
  prompt_source: synthetic

SYNTHETIC_CTX128K:
  name: synthetic_ctx128k
  factor: context_length
  levels:
  - id: SYNTHETIC_ctx128k
    context_length: 131072
    checkpoint_every: 0
    notes: 'synthetic prompt at the native 128k rung'
  - id: SYNTHETIC_ctx128k_targetonly
    context_length: 131072
    spec_steps: 0
    checkpoint_every: 0
    notes: 'Paired target-only baseline for the synthetic 128k rung.'

SYNTHETIC_CTX256K:
  name: synthetic_ctx256k
  factor: context_length
  levels:
  - id: SYNTHETIC_ctx256k
    context_length: 262144
    rope_type: llama3
    rope_factor: 16
    checkpoint_every: 0
    notes: 'synthetic prompt at the gated 256k rung'
  - id: SYNTHETIC_ctx256k_targetonly
    context_length: 262144
    spec_steps: 0
    rope_type: llama3
    rope_factor: 16
    checkpoint_every: 0
    notes: 'Paired target-only baseline for the synthetic 256k rung.'

SYNTHETIC_CTX512K:
  name: synthetic_ctx512k
  factor: context_length
  levels:
  - id: SYNTHETIC_ctx512k
    context_length: 524288
    rope_type: llama3
    rope_factor: 32
    checkpoint_every: 0
    notes: 'synthetic prompt at the gated 512k rung'
  - id: SYNTHETIC_ctx512k_targetonly
    context_length: 524288
    spec_steps: 0
    rope_type: llama3
    rope_factor: 32
    checkpoint_every: 0
    notes: 'Paired target-only baseline for the synthetic 512k rung.'
