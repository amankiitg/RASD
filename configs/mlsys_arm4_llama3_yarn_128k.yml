# MLSys Phase A — ARM4 @128k: Llama-3.1-8B, NO extrapolation (in-distribution anchor)
#
# ARM4 is the WITHIN-MODEL control that separates two explanations for why
# Arm1's acceptance was ~0.10 while Arm2's was ~0.89:
#
#   (H1) "YaRN/OOD RoPE extrapolation breaks speculation"
#   (H2) "Llama-2-7B is simply a worse/base model than Llama-3.1-8B"
#
# Arm1 vs Arm2 changes BOTH the base model and the RoPE regime, so it cannot
# distinguish them. ARM4 holds the model FIXED at Llama-3.1-8B (the Arm2
# target) and varies ONLY the RoPE extrapolation factor: 1 -> 2 -> 4.
# If acceptance collapses as the YaRN factor rises within one model, H1 is
# supported; if it stays high, H2 is.
#
# THE LADDER (target Llama-3.1-8B, native window = 131072):
#   128k  rope_type="none"  factor 1  (this file)  <- replicates Arm2
#   256k  rope_type="yarn"  factor 2  (mlsys_arm4_llama3_yarn_256k.yml)
#   512k  rope_type="yarn"  factor 4  (mlsys_arm4_llama3_yarn_512k.yml)
#
# This 128k cell deliberately uses rope_type="none", NOT yarn-with-factor-1.
# yarn@factor 1 would REPLACE Llama-3.1's own 'llama3' rope block with an
# identity YaRN dict, which is a DIFFERENT treatment from Arm2 and would
# destroy the anchor. rope_type="none" leaves the model's native block
# untouched, so this cell is byte-identical in RoPE terms to Arm2 and can be
# read as an Arm2 replication at 2x the round count (max_new_tokens=128 vs 64).
#
# DRAFT: identical to Arm2 — Llama-3.2-1B, NF4, hard-capped at 4096 tokens.
# Holding the draft config fixed across the whole ladder means the only
# moving part between rungs is the target's RoPE extrapolation.
#
# VERIFY BEFORE LAUNCH (free, CPU-only):
#   python scripts/mlsys_check_arm4_rope.py
#
# Seeds [42, 123, 456]. 3 seeds x 2 groups = 6 runs.

canary:
  id:   "mlsys_arm4_128k_canary_s42"
  seed: 42
  max_new_tokens: 16

defaults:
  target_model_name: "meta-llama/Llama-3.1-8B"
  draft_model_name:  "meta-llama/Llama-3.2-1B"
  target_revision:   null
  draft_revision:    null
  spec_steps:        4
  kv_block_size:     2048
  prefetch_depth:    1
  # Native window: no scaling. Rung 1 of the ladder (factor 1).
  rope_type:         "none"
  kv_quant:          true
  # 128 tokens = 2x the Arm2 value, so every trace has ~2x the rounds and
  # the Hartigan dip test has real power. Defaults elsewhere stay at 64 so
  # M3/M4 replay is untouched.
  max_new_tokens:    128
  dtype:             "bfloat16"
  quantize_draft:    true
  quantize_target:   true
  draft_window_cap:  4096           # held fixed across the whole ladder
  temperature:       1.0
  top_p:             1.0
  seeds:             [42, 123, 456]

# ---------------------------------------------------------------------------
# ARM4 rung 1 — speculative (RASD) at 128k, native (factor 1)
# ---------------------------------------------------------------------------
ARM4_SPEC:
  name:   "arm4_llama3_yarn_128k_spec"
  factor: "context_length"
  levels:
    - id: "ARM4_llama3_yarn_128k"
      context_length: 131072
      # checkpoints are DISABLED: at these contexts a checkpoint persists the
      # full generation state and the 1M cells wrote 16 TB last run. The
      # per-token traces are the artefact the analysis needs; --resume still
      # skips already-completed runs.
      checkpoint_every: 0
      notes: "ARM4 rung 1: Llama-3.1-8B native @128k (factor 1, replicates Arm2 at 2x rounds)"

# ---------------------------------------------------------------------------
# ARM4 rung 1 — matched target-only baseline (spec_steps=0)
# ---------------------------------------------------------------------------
ARM4_TARGET_ONLY:
  name:   "arm4_llama3_yarn_128k_target_only"
  factor: "context_length"
  levels:
    - id: "ARM4_llama3_yarn_128k_targetonly"
      context_length: 131072
      spec_steps: 0
      checkpoint_every: 0
      notes: "matched target-only baseline for ARM4_llama3_yarn_128k"
