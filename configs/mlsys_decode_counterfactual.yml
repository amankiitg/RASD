  factor: context_length
  levels:
  - id: PD_BASE_SPEC
    context_length: 131072
    documents: [pg19_train_0]
    checkpoint_every: 0
    temperature: 0.7
    notes: 'priority 1 baseline: ring rotation, spec arm'

PD_SPLIT_TARGET:
