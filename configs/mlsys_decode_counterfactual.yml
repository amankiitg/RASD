    documents: [pg19_train_0]
    spec_steps: 0
    checkpoint_every: 0
    temperature: 0.7
    ring_decode_mode: "split_kv"
    notes: 'priority 1 counterfactual: no rotation; local shard + one all_gather merge'
PD_SPLIT_SPEC:
  name: pd_split_spec
  factor: context_length
  levels:
  - id: PD_SPLIT_SPEC
    context_length: 131072
    documents: [pg19_train_0]
    checkpoint_every: 0
    temperature: 0.7
    ring_decode_mode: "split_kv"
    notes: 'priority 1 counterfactual, spec arm'

PD_CHUNK_TARGET:
  name: pd_chunk_target
  factor: context_length
  levels:
  - id: PD_CHUNK_TARGET
    context_length: 131072
    documents: [pg19_train_0]
    spec_steps: 0
    checkpoint_every: 0
    temperature: 0.7
    kv_block_size: 32768
    notes: 'priority 2: kv_block_size >= S_local removes chunking entirely; must be bit-identical to PD_BASE_TARGET'
