# MLSys — engine_cap_smoke: the FIRST stage after gate calibration.
#
# WHY THIS EXISTS. The generation cap was changed in the engine so that a verify
# round cannot overshoot `max_new_tokens` (previously a round committed up to
# n_acc + 1 tokens, so a run landed anywhere in [cap, cap + gamma]). That change
# has NEVER EXECUTED ON A GPU. If it is wrong it does not fail loudly: it
# silently changes the generated length, which breaks the
# `prompt + BOS + generated == context` identity, invalidates the losslessness
# comparison (the target-only arm stops exactly on the cap), and makes the
# acceptance denominator a function of acceptance itself.
#
# So it is validated first, on ONE document, at a context small enough to be
# cheap, at two caps (64 and 1024) so the code path where the final round is cut
# short is exercised at a different remainder than the one the campaign uses.
#
# The manifest STOPS before natural_f1_128k if any assertion fails.
defaults:
  target_model_name: meta-llama/Llama-3.1-8B
  draft_model_name: meta-llama/Llama-3.2-1B
  target_revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  draft_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  spec_steps: 4
  kv_block_size: 2048
  prefetch_depth: 1
  kv_quant: true
  dtype: bfloat16
  quantize_draft: true
  quantize_target: true
  draft_window_cap: 4096
  ignore_eos: true
  temperature: 0.0
  top_p: 1.0
  seeds: [42]
  log_per_token: true
  save_generated_tokens: true
  measure_target_ppl: false          # not what this stage is for
  prompt_source: pg19_document
  prompt_documents_json: data/processed/pg19_docs/documents.json

CAP_SMOKE:
  name: engine_cap_smoke
  factor: context_length
  levels:
  - id: CAPS_prefix64
    context_length: 131072
    documents: [pg19_train_1]
    max_new_tokens: 64
    checkpoint_every: 0
    notes: 'cap=64: the truncated final round has a different remainder than 1024'
  - id: CAPS_prefix64_targetonly
    context_length: 131072
    documents: [pg19_train_1]
    max_new_tokens: 64
    spec_steps: 0
    checkpoint_every: 0
    notes: 'target-only partner at cap=64'
  - id: CAPS_prefix1024
    context_length: 131072
    documents: [pg19_train_1]
    max_new_tokens: 1024
    checkpoint_every: 0
    notes: 'the cap the campaign actually uses'
  - id: CAPS_prefix1024_targetonly
    context_length: 131072
    documents: [pg19_train_1]
    max_new_tokens: 1024
    spec_steps: 0
    checkpoint_every: 0
    notes: 'target-only partner at cap=1024; the losslessness reference'
  # NO ROW PROBES. The teacher-forced check is REPORT ONLY and disabled: the
  # probe it ran fed the FULL prompt to a model that, at world_size > 1, is fed
  # the rank's SLICE (src/models/rasd_inference.py:1458), so its 8-rank numbers
  # measured a forward the engine never runs -- 6.125 logits of shortfall where
  # the 1-rank measurement is 0.375, which is the wrong input talking, not the
  # numerics. It is being rebuilt on the production decode paths (see 6.1f and
  # the follow-up task in results/mlsys/MORNING_REPORT.txt); until then, running
  # it costs stage wall clock for numbers nothing can act on. The bf16 pair
  # stays, because it is still the pair a precision-comparison belongs on.
  #
  # What gated before, and what gates now: the teacher-forced tolerance is gone
  # as a gate, and the 16 structural assertions -- row identity, measured
  # precision, cap enforcement, gap alignment, and unit-matched references --
  # remain gates. Blank/repeat shares were NOT among them, and that claim was
  # false until 2026-10-10: `scripts/mlsys_cap_smoke_check.py` tests no
  # repetition at all. Repetition lives in the coherence gate, where it used to
  # be judged only RELATIVE to a paired baseline (2.0x tolerance), which cannot
  # fire on a loop both arms are in -- measured ratios were 1.07x, 1.32x and
  # 1.80x on rows whose generations were 65-97% repeated. Both sites now carry
  # the ABSOLUTE ceilings in src/analysis/repetition.py. NF4 was always
  # report-only: its own noise flips 20% of argmaxes at this context, the same
  # order as the defects a gate must catch.
  - id: CAPS_prefix64_bf16
    context_length: 131072
    documents: [pg19_train_1]
    max_new_tokens: 64
    kv_quant: false
    checkpoint_every: 0
    notes: 'bf16 KV: the pair the teacher-forced losslessness gate runs on'
  - id: CAPS_prefix64_bf16_targetonly
    context_length: 131072
    documents: [pg19_train_1]
    max_new_tokens: 64
    spec_steps: 0
    kv_quant: false
    checkpoint_every: 0
    notes: 'target-only partner of CAPS_prefix64_bf16'
