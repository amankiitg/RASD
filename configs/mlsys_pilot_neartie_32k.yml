# MLSys pilot — M3 near-tie reproduction at 32k with the cross margin logged.
#
# WHY 32k AND NOT 128k. The 2026-10-10 campaign's `natural_f1_128k_losslessness`
# stage reported 10 MISMATCHes: the speculative and target-only arms agreed on the
# prompt and then emitted different tokens. 8 of those 10 diverged at a
# top1-top2 margin under 0.5 (fp4 quantises logits in 0.0625 steps, so those are a
# few rounding steps from a tie) and 2 at margins of 1.75 and 6.875, which the
# existing traces cannot explain at all: each arm records only its OWN top1-top2
# gap, and when the arms favour different pairs of tokens that scalar says nothing
# about how close the two arms were on the same candidate.
#
# This run adds `dump_logits_topk: 6` so the CROSS margin is measurable -- what
# each arm thought of the OTHER arm's token at the divergence. It costs a 32k
# context and a 128-token generation rather than 128k/1024, because the question
# is answered at the first divergence, which the campaign saw at tokens 2 and 16.
#
# The two documents are the two that mismatched earliest at 128k
# (pg19_train_1 at token 2, pg19_train_0 at token 16), so the reproduction has the
# best chance of landing in a 128-token window.
defaults:
  target_model_name: meta-llama/Llama-3.1-8B
  draft_model_name: meta-llama/Llama-3.2-1B
  target_revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  draft_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  spec_steps: 4
  kv_block_size: 2048
  prefetch_depth: 1
  kv_quant: true
  dtype: bfloat16
  quantize_draft: true
  quantize_target: true
  draft_window_cap: 4096
  ignore_eos: true
  temperature: 0.0
  top_p: 1.0
  seeds: [42]
  log_per_token: true
  save_generated_text: true
  save_generated_tokens: true
  dump_logits_topk: 6
  measure_target_ppl: false
  prompt_source: pg19_document
  prompt_documents_json: data/processed/pg19_docs/documents.json
PILOT_NEARTIE_SPEC:
  name: pilot_neartie_32k
  factor: context_length
  levels:
  - id: PILOT_NEARTIE
    context_length: 32768
    documents: [pg19_train_1, pg19_train_0]
    max_new_tokens: 128
    checkpoint_every: 0
    notes: 'speculative arm; cross margin at the first divergence'
PILOT_NEARTIE_TARGET:
  name: pilot_neartie_32k_target
  factor: context_length
  levels:
  - id: PILOT_NEARTIE_targetonly
    context_length: 32768
    documents: [pg19_train_1, pg19_train_0]
    max_new_tokens: 128
    spec_steps: 0
    checkpoint_every: 0
    notes: 'target-only partner for the same request, same prompt'
