# RASD Ablation Grid Configuration
#
# One factor is varied at a time (OFA design).
# The "baseline" row in each group is the shared default config.
# Seeds: {42, 123, 456} for every run.
#
# Ablation IDs:
#   A1  draft_model_name    (model size)
#   A2  spec_steps          (k, speculative steps)
#   A3  kv_block_size       (ring comm block size)
#   A4  prefetch_depth      (overlap strategy)
#   A5  target_model_name   (target model family)

# ---------------------------------------------------------------------------
# Shared defaults (used unless overridden in a group)
# ---------------------------------------------------------------------------
defaults:
  target_model_name: "meta-llama/Meta-Llama-3.1-8B"
  draft_model_name:  "meta-llama/Llama-3.2-1B"
  spec_steps:        4
  kv_block_size:     512
  prefetch_depth:    1
  max_new_tokens:    256
  context_length:    8192         # 8k — conservative start; scale to 64k once stable
  dtype:             "bfloat16"
  quantize_draft:    true
  quantize_target:   true     # 4-bit NF4 — required to fit both models on 80GB A100s
  temperature:       1.0
  top_p:             1.0
  seeds:             [42, 123, 456]

# ---------------------------------------------------------------------------
# A1 — Draft Model Size
# Factor: draft_model_name
# All other params: defaults
# ---------------------------------------------------------------------------
A1:
  name: "draft_model_size"
  factor: "draft_model_name"
  # Both drafts are LLaMA-family — same tokenizer as the LLaMA-3.1-8B target.
  # This is required for speculative decoding correctness.
  levels:
    - id: "A1_llama3_1b"
      draft_model_name: "meta-llama/Llama-3.2-1B"   # 1B params, LLaMA-3 tokenizer
      notes: "LLaMA-3.2 1B — small draft, same family as target"

    - id: "A1_llama3_3b"
      draft_model_name: "meta-llama/Llama-3.2-3B"   # 3B params, LLaMA-3 tokenizer
      notes: "LLaMA-3.2 3B — larger draft, higher acceptance expected"

# ---------------------------------------------------------------------------
# A2 — Number of Speculative Steps (k)
# Factor: spec_steps
# ---------------------------------------------------------------------------
A2:
  name: "spec_steps"
  factor: "spec_steps"
  levels:
    - id: "A2_k2"
      spec_steps: 2
    - id: "A2_k4"
      spec_steps: 4       # matches default
    - id: "A2_k6"
      spec_steps: 6
    - id: "A2_k8"
      spec_steps: 8
    - id: "A2_k12"
      spec_steps: 12

# ---------------------------------------------------------------------------
# A3 — KV Cache Block Size (ring communication granularity)
# Factor: kv_block_size (tokens)
# ---------------------------------------------------------------------------
A3:
  name: "kv_block_size"
  factor: "kv_block_size"
  levels:
    - id: "A3_block256"
      kv_block_size: 256
    - id: "A3_block512"
      kv_block_size: 512    # matches default
    - id: "A3_block1024"
      kv_block_size: 1024
    - id: "A3_block2048"
      kv_block_size: 2048

# ---------------------------------------------------------------------------
# A4 — Communication / Computation Overlap Strategy
# Factor: prefetch_depth
#   0 = synchronous (no overlap)
#   1 = async prefetch 1 block
#   2 = async prefetch 2 blocks
# ---------------------------------------------------------------------------
A4:
  name: "overlap_strategy"
  factor: "prefetch_depth"
  levels:
    - id: "A4_sync"
      prefetch_depth: 0
      notes: "Synchronous — target blocks waiting for KV fetch"
    - id: "A4_async1"
      prefetch_depth: 1     # matches default
      notes: "Async prefetch 1 block — fetched during draft phase"
    - id: "A4_async2"
      prefetch_depth: 2
      notes: "Async prefetch 2 blocks — deeper pipeline, hides higher latency"

# ---------------------------------------------------------------------------
# A5 — Target Model
# Factor: target_model_name
# ---------------------------------------------------------------------------
A5:
  name: "target_model"
  factor: "target_model_name"
  # Draft model must match the target's family/tokenizer.
  # LLaMA target → LLaMA-3.2-1B draft (default)
  # Mistral target → Mistral family draft (Ministral-3B, smallest available)
  levels:
    - id: "A5_llama3_8b"
      target_model_name: "meta-llama/Meta-Llama-3.1-8B"   # matches default
      draft_model_name:  "meta-llama/Llama-3.2-1B"
      notes: "LLaMA-3.1 8B target with LLaMA-3.2 1B draft"

    - id: "A5_mistral_7b"
      target_model_name: "mistralai/Mistral-7B-v0.1"
      draft_model_name:  "mistralai/Ministral-3B-instruct-2410"
      notes: "Mistral 7B target with Ministral 3B draft — same family"

# ---------------------------------------------------------------------------
# Metrics to log (all logged to wandb + local CSV)
# ---------------------------------------------------------------------------
metrics:
  - tokens_generated
  - time_sec
  - throughput_tps
  - acceptance_rate
  - mean_latency_ms
  - gpu_peak_mem_mb
  - n_rounds
