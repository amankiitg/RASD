# RASD Ablation Grid Configuration
#
# One factor is varied at a time (OFA design).
# The "baseline" row in each group is the shared default config.
# Seeds: {42, 123, 456} for every run.
#
# Ablation IDs:
#   A1  draft_model_name    (model size)
#   A2  spec_steps          (k, speculative steps)
#   A3  kv_block_size       (ring comm block size)
#   A4  prefetch_depth      (overlap strategy)
#   A5  target_model_name   (target model family)
#
# ===========================================================================
# RunPod Operational Guide (required — must be followed on every fresh pod)
# ===========================================================================
#
# 1. GPU leak check (REQUIRED before any run):
#    ssh ... 'nvidia-smi --query-gpu=index,memory.used --format=csv,noheader'
#    Any GPU showing >0 MiB = orphaned driver memory from prior tenant.
#    Terminate the pod and create a new one (different node). Do NOT proceed.
#
# 2. Dependencies (install AFTER rsync, BEFORE any run):
#    pip install 'transformers==4.44.2' 'accelerate==0.33.0' \
#                'bitsandbytes>=0.49.0' wandb numpy -q
#    Why these pins (see memory/feedback_dep_versions.md):
#      - transformers==4.44.2: needs dynamic RoPE (4.38 fails at 8192 ctx on Llama-2);
#                              tuple past_key_values (5.x uses DynamicCache)
#      - accelerate==0.33.0: >=1.0 breaks bitsandbytes .to() on quantized models
#      - bitsandbytes>=0.49.0: older lacks CUDA 12.9 precompiled .so
#
# 3. Timeout patch on pod (subprocess default is 3600s, way too long):
#    sed -i 's/timeout=3600/timeout=120/' run_experiment.py
#
# 4. Launch with env vars INLINE (nohup drops shell env):
#    ssh ... 'cd /workspace/RASD && \
#      export WANDB_API_KEY=... && \
#      export HF_TOKEN=... && \
#      export HF_HOME=/workspace/hf_cache && \
#      nohup python run_experiment.py --config configs/ablations.yml \
#        --output results/ablations/ablations.csv --resume --nproc 8 > run.log 2>&1 &'
#    Keys live in runpod_creds.md (gitignored) at project root.
#
# 5. Never pkill CUDA procs (SIGKILL leaks driver memory permanently on the
#    node — reboot required). Use kill -TERM on the orchestrator PID;
#    let the 120s subprocess timeout handle stuck workers.
#
# 6. Clean-kill procedure for a running batch (always use this, never pkill -9):
#    # step A — find orchestrator + torchrun PIDs
#    ORCH_PID=$(pgrep -f 'run_experiment.py --config' | head -1)
#    TORCHRUN_PID=$(pgrep -f 'torchrun.*run_experiment' | head -1)
#    # step B — SIGTERM orchestrator FIRST (stops it launching new runs)
#    kill -TERM $ORCH_PID
#    # step C — SIGTERM the active torchrun (propagates to all 8 workers)
#    kill -TERM $TORCHRUN_PID
#    # step D — wait 90s, then verify clean exit
#    sleep 90
#    ps aux | grep -E 'run_experiment|torchrun' | grep -v grep | wc -l   # 0
#    nvidia-smi --query-gpu=index,memory.used --format=csv,noheader      # 0 MiB × 8
#
#    Why both kills: killing only the orchestrator leaves torchrun running
#    to end-of-current-run (orchestrator's subprocess.wait is dead so the
#    120s timeout never fires). Why SIGTERM not SIGKILL: workers need time
#    to flush NCCL and release CUDA memory, otherwise driver-level leak.
#    Also: `pgrep -f 'run_experiment.py --config'` occasionally returns a
#    bash wrapper PID first — verify the match is the python orchestrator.
# ===========================================================================

# ---------------------------------------------------------------------------
# Canary / default run
# Runs first with seed 42 and all default params.
# If it fails, the full ablation grid is aborted.
# This catches environment issues (missing deps, OOM, model access) early
# without burning through all 48 runs.
# ---------------------------------------------------------------------------
canary:
  id:   "default_canary_s42"
  seed: 42
  max_new_tokens: 32      # short run — just enough to confirm the pipeline works

# ---------------------------------------------------------------------------
# Shared defaults (used unless overridden in a group)
# ---------------------------------------------------------------------------
defaults:
  target_model_name: "meta-llama/Llama-2-7b-hf"
  draft_model_name:  "princeton-nlp/Sheared-LLaMA-1.3B"
  # HF revisions captured 2026-04-16. Pin so weight updates don't silently
  # change M3 numbers. Gated models (Llama-2) need HF_TOKEN to resolve;
  # run `scripts/pin_hf_revisions.py` on a pod with the token set to refresh.
  target_revision: null                                                    # Llama-2-7b-hf: fill after next pod (gated)
  draft_revision:  "a4b76938edbf571ea7d7d9904861cbdca08809b4"               # Sheared-LLaMA-1.3B
  spec_steps:        4
  kv_block_size:     512
  prefetch_depth:    1
  max_new_tokens:    256
  context_length:    8192         # 8k — conservative start; scale to 64k once stable
  dtype:             "bfloat16"
  quantize_draft:    true
  quantize_target:   true     # 4-bit NF4 — required to fit both models on 80GB A100s
  temperature:       1.0
  top_p:             1.0
  seeds:             [42, 123, 456]

# ---------------------------------------------------------------------------
# A1 — Draft Model Size
# Factor: draft_model_name
# All other params: defaults
# ---------------------------------------------------------------------------
A1:
  name: "draft_model_size"
  factor: "draft_model_name"
  # Both drafts use LLaMA-1/2 SentencePiece tokenizer (vocab=32000) — compatible with Llama-2-7b target.
  levels:
    - id: "A1_tinyllama_1b"
      draft_model_name: "TinyLlama/TinyLlama_v1.1"           # 1.1B params, LLaMA-2 tokenizer
      draft_revision:   "ff3c701f2424c7625fdefb9dd470f45ef18b02d6"
      notes: "TinyLlama 1.1B — small draft, same LLaMA-2 tokenizer (vocab=32000)"

    - id: "A1_sheared_1b"
      draft_model_name: "princeton-nlp/Sheared-LLaMA-1.3B"   # 1.3B params, LLaMA-2 tokenizer
      draft_revision:   "a4b76938edbf571ea7d7d9904861cbdca08809b4"
      notes: "Sheared-LLaMA 1.3B — matches default draft"

# ---------------------------------------------------------------------------
# A2 — Number of Speculative Steps (k)
# Factor: spec_steps
# ---------------------------------------------------------------------------
A2:
  name: "spec_steps"
  factor: "spec_steps"
  levels:
    - id: "A2_k2"
      spec_steps: 2
    - id: "A2_k4"
      spec_steps: 4       # matches default
    - id: "A2_k6"
      spec_steps: 6
    - id: "A2_k8"
      spec_steps: 8
    - id: "A2_k12"
      spec_steps: 12

# ---------------------------------------------------------------------------
# A3 — KV Cache Block Size (ring communication granularity)
# Factor: kv_block_size (tokens)
# ---------------------------------------------------------------------------
A3:
  name: "kv_block_size"
  factor: "kv_block_size"
  levels:
    - id: "A3_block256"
      kv_block_size: 256
    - id: "A3_block512"
      kv_block_size: 512    # matches default
    - id: "A3_block1024"
      kv_block_size: 1024
    - id: "A3_block2048"
      kv_block_size: 2048

# ---------------------------------------------------------------------------
# A4 — Communication / Computation Overlap Strategy
# Factor: prefetch_depth
#   0 = synchronous (no overlap)
#   1 = async prefetch 1 block
#   2 = async prefetch 2 blocks
# ---------------------------------------------------------------------------
A4:
  name: "overlap_strategy"
  factor: "prefetch_depth"
  levels:
    - id: "A4_sync"
      prefetch_depth: 0
      notes: "Synchronous — target blocks waiting for KV fetch"
    - id: "A4_async1"
      prefetch_depth: 1     # matches default
      notes: "Async prefetch 1 block — fetched during draft phase"
    - id: "A4_async2"
      prefetch_depth: 2
      notes: "Async prefetch 2 blocks — deeper pipeline, hides higher latency"

# ---------------------------------------------------------------------------
# A5 — Target Model
# Factor: target_model_name
# ---------------------------------------------------------------------------
A5:
  name: "target_model"
  factor: "target_model_name"
  # Both targets are LLaMA-2 family — same tokenizer, no vocab mismatch.
  # Sheared-LLaMA-1.3B draft works for both since tokenizer is shared across all LLaMA-2 sizes.
  levels:
    - id: "A5_llama2_7b"
      target_model_name: "meta-llama/Llama-2-7b-hf"         # matches default
      draft_model_name:  "princeton-nlp/Sheared-LLaMA-1.3B"
      notes: "LLaMA-2 7B target — baseline target size"

    - id: "A5_llama2_13b"
      target_model_name: "meta-llama/Llama-2-13b-hf"
      draft_model_name:  "princeton-nlp/Sheared-LLaMA-1.3B"
      notes: "LLaMA-2 13B target — larger target, same draft and tokenizer"

# ---------------------------------------------------------------------------
# Metrics to log (all logged to wandb + local CSV)
# ---------------------------------------------------------------------------
metrics:
  - tokens_generated
  - time_sec
  - throughput_tps
  - acceptance_rate
  - mean_latency_ms
  - gpu_peak_mem_mb
  - n_rounds
