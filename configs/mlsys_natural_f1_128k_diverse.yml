# MLSys — natural-text f1 at 128k on a DIVERSE document pool.
#
# TARGET POLICY: Llama-3.1-8B. At 128k it runs its NATIVE shipped `llama3` rope block, untouched; `rope_type: none` asserts that.
#
# DECODING CONTRACT (docs/mlsys_analysis_plan.md section 2): greedy,
# 1024 generated tokens, ignore_eos true, prompt = context - 1024 - 1 so the
# sequence the engine builds (prompt + leading BOS + generation) is EXACTLY the
# rung context. The builder derives the prompt from `context_length`, so the
# value here is the rung, not the prompt length.
#
# UNITS OF INDEPENDENCE: the DOCUMENT (one PG-19 book). `seeds: [42]` because
# greedy decoding is deterministic, so a second seed would repeat a run rather
# than replicate it; replication is the 10 documents below, identical at every
# rung so the rung comparison is paired (same book, different context).
#
# REPORTED LIMITATION: only 14 PG-19 train books reach 512k tokens, so this set
# is 2 Bibles, 2 Shakespeare volumes and an omnibus. The composition is constant
# across rungs and cancels in the paired comparison, but it limits
# generalisation — which is what the separate `diverse` arm checks at 128k.
# WHY THIS ARM EXISTS: the core-10 that the paired design is forced
# into at 512k is Bible/omnibus-heavy. This arm measures the same
# 128k configuration on 10 books drawn uniformly from the 534 books
# eligible at 128k, so the headline acceptance number can be checked
# against one that is not a property of that set.
defaults:
  target_model_name: meta-llama/Llama-3.1-8B
  draft_model_name: meta-llama/Llama-3.2-1B
  target_revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  draft_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  spec_steps: 4
  kv_block_size: 2048
  prefetch_depth: 1
  kv_quant: true
  dtype: bfloat16
  quantize_draft: true
  quantize_target: true
  draft_window_cap: 4096
  max_new_tokens: 1024
  ignore_eos: true
  temperature: 1.0
  top_p: 1.0
  seeds: [42]
  log_per_token: true
  save_generated_text: true
  save_generated_tokens: true     # losslessness compares token ids, not text
  measure_target_ppl: true        # target quality beside every acceptance figure
  prompt_source: pg19_document
  prompt_documents_json: data/processed/pg19_docs_diverse/documents.json
DIVERSE_F1_SPEC:
  name: natural_f1_128k_diverse
  factor: context_length
  levels:
  - id: NATURAL_f1_128k_diverse
    context_length: 131072
    checkpoint_every: 0
    notes: '10 books sampled from the 534 eligible at 128k (seeded, seed 20261006).'
DIVERSE_F1_TARGET_ONLY:
  name: natural_f1_128k_diverse_target_only
  factor: context_length
  levels:
  - id: NATURAL_f1_128k_diverse_targetonly
    context_length: 131072
    spec_steps: 0
    checkpoint_every: 0
    notes: 'Paired target-only baseline for the diverse arm.'
