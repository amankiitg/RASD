# PROTOCOL A: SAMPLING. target gradientai/...-Gradient-1048k (native 1M, no rope
# scaling), draft Llama-3.2-1B (window capped 4096), 8x A100-80GB, NF4 KV.
#
# WHY SAMPLING. Under greedy on 2026-10-11, 9 of 15 rows looped, and a greedy cycle is
# trivially "accepted" (0.6429 and 0.7419 against 0.2132 on the one clean 1M row), so
# looping both inflates acceptance and destroys usable n. Sampling attacks the cause; the
# exclusion rule stays anyway.
#
# temperature 0.7, top_p 1.0, seed 42, 128 tokens, periodicity reported for every row.
# The engine implements the standard rejection criterion min(1, p_target/p_draft) with the
# residual bonus resample, tested at temperature 1.0 and already exercised end-to-end by
# the natural_f1 and m4 campaigns -- but never at 1M, hence step SAMP_CHECK_1M_SPEC.
#
# TARGET-ONLY ROWS ARE SUBSAMPLED: measured target-only throughput varied under 2% across
# books last night (0.05113/0.05132/0.05236 at 1M), so 2 books at 1M and 1 book at each
# aligned rung are enough, and every speedup divides by the MEAN target-only tok/s at that
# context FROM THIS SESSION. Speedups and tok/s are computed as tokens_generated/time_sec,
# never from the rounded throughput_tps field.
#
# ORDER IS RUN ORDER (the remote script derives its step list from this file's key order):
#   a sanity (separate config)  b quality redo, greedy  c 1M sampling check (STOPS the
#   sampling stages if it fails)  d 1M  e aligned 512k  f aligned 128k  g rope, LAST.
# If time or budget runs short, stages are dropped from the END (g, then f); d is never
# dropped.
defaults:
  target_model_name: gradientai/Llama-3-8B-Instruct-Gradient-1048k
  target_revision: cd3069b65a8eb13da639d332a5f61b0fbb29fa73
  draft_model_name: meta-llama/Llama-3.2-1B
  draft_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  spec_steps: 4
  kv_block_size: 2048
  prefetch_depth: 1
  rope_type: "none"
  kv_quant: true
  dtype: bfloat16
  quantize_draft: true
  quantize_target: true
  draft_window_cap: 4096
  ignore_eos: true
  top_p: 1.0
  seeds: [42]
  log_per_token: true
  save_generated_tokens: true
  temperature: 0.7
  max_new_tokens: 128
  measure_target_ppl: false
  prompt_gen_tokens: 1024
  prompt_source: pg19_document
QUALITY_FIX_128K:
  name: quality_fix_128k
  factor: context_length
  levels:
  - id: QUALITY_FIX_128K
    context_length: 131072
    documents: [pg19_train_0, pg19_train_1, pg19_train_915]
    prompt_documents_json: data/processed/pg19_1m_128kwin/documents.json
    checkpoint_every: 0
    temperature: 0.0
    max_new_tokens: 8
    measure_target_ppl: true
    notes: 'ppl of the final 1024 tokens at 128k, GREEDY, aligned to the 1M continuation'
